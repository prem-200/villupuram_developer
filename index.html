<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="Villupuram Developer | Premium Web Design & Development Agency" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.webp" />

    <title>Villupuram Developer | Premium Web Design &amp; Development Agency</title>

    <!-- Preload Critical Logo Asset -->
    <link rel="preload" href="/logo.webp" as="image" type="image/webp" fetchpriority="high" />

    <!-- Preconnect to Font Servers -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Non-Blocking Google Fonts Loading -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />

      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" />
    </noscript>

    <link rel="icon" type="image/webp" href="/logo.webp" />

    <!-- LocalBusiness & WebSite JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Villupuram Developer",
      "image": "/logo.webp",
      "description": "Premium modern web design & software development agency serving startups and local businesses.",
      "telephone": "+916379348861",
      "email": "villupuram.developer@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Villupuram",
        "addressRegion": "Tamil Nadu",
        "addressCountry": "IN"
      },
      "priceRange": "₹₹",
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
        "opens": "09:00",
        "closes": "20:00"
      }
    }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
