<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <!-- Definition of Gradients -->
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0f" />
      <stop offset="100%" stop-color="#14141a" />
    </linearGradient>
    <linearGradient id="blue-purple-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ffa800" />
    </linearGradient>
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Browser Container -->
  <rect width="600" height="350" rx="8" fill="url(#bg-grad-3)" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  
  <!-- Browser Header Bar -->
  <path d="M 0,8 A 8,8 0 0,1 8,0 L 592,0 A 8,8 0 0,1 600,8 L 600,32 L 0,32 Z" fill="#181822" />
  <circle cx="18" cy="16" r="4.5" fill="#ef4444" />
  <circle cx="32" cy="16" r="4.5" fill="#fbbf24" />
  <circle cx="46" cy="16" r="4.5" fill="#22c55e" />
  
  <!-- Mock URL Bar -->
  <rect x="75" y="7" width="450" height="18" rx="4" fill="#0f0f15" stroke="rgba(255,255,255,0.04)" />
  <text x="300" y="20" font-family="'Inter', sans-serif" font-size="9" fill="rgba(255,255,255,0.3)" text-anchor="middle">advisory.villupuram.dev</text>

  <!-- Web Content Area -->
  <!-- Navigation Header Mock -->
  <rect x="30" y="55" width="80" height="12" rx="2" fill="url(#blue-purple-3)" opacity="0.8" />
  <line x1="450" y1="61" x2="570" y2="61" stroke="rgba(255,255,255,0.2)" stroke-width="2.5" />

  <!-- Layout: Two Columns -->
  <!-- Left Column: Typography & Form Info -->
  <text x="30" y="115" font-family="'Outfit', sans-serif" font-weight="900" font-size="22" fill="#ffffff">TRUSTED ADVISORY</text>
  <text x="30" y="138" font-family="'Outfit', sans-serif" font-weight="900" font-size="22" fill="url(#blue-purple-3)">FOR BUSINESSES.</text>
  
  <!-- Text Description Lines -->
  <line x1="30" y1="165" x2="260" y2="165" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="30" y1="177" x2="230" y2="177" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="30" y1="189" x2="200" y2="189" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Dynamic Service Badges -->
  <rect x="30" y="215" width="90" height="20" rx="4" fill="#1b1b24" stroke="rgba(255,255,255,0.06)" />
  <circle cx="42" cy="225" r="4.5" fill="#22c55e" />
  <rect x="53" y="222" width="55" height="5" rx="1" fill="rgba(255,255,255,0.4)" />

  <rect x="130" y="215" width="90" height="20" rx="4" fill="#1b1b24" stroke="rgba(255,255,255,0.06)" />
  <circle cx="142" cy="225" r="4.5" fill="#ff6b00" />
  <rect x="153" y="222" width="55" height="5" rx="1" fill="rgba(255,255,255,0.4)" />

  <!-- CTA Button -->
  <rect x="30" y="255" width="120" height="30" rx="4" fill="#ff6b00" />
  <text x="90" y="274" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#ffffff" text-anchor="middle">Book Consultation</text>

  <!-- Right Column: Visual Dashboard Charts -->
  <rect x="315" y="95" width="255" height="210" rx="8" fill="#111116" stroke="rgba(255,255,255,0.05)" stroke-width="1.2" />
  
  <!-- Mini Chart Header -->
  <text x="330" y="120" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" fill="#ffffff">Growth Analytics</text>
  <rect x="500" y="110" width="55" height="15" rx="4" fill="rgba(255,255,255,0.04)" />
  <text x="528" y="121" font-family="'Inter', sans-serif" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle">YTD</text>

  <!-- Chart Grid Lines -->
  <line x1="330" y1="160" x2="550" y2="160" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="330" y1="200" x2="550" y2="200" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <line x1="330" y1="240" x2="550" y2="240" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Area Fill under Chart Path -->
  <path d="M 330,240 Q 360,200 390,210 T 450,150 T 510,180 T 550,135 L 550,260 L 330,260 Z" fill="url(#chart-grad)" />
  
  <!-- Chart Line Path -->
  <path d="M 330,240 Q 360,200 390,210 T 450,150 T 510,180 T 550,135" fill="none" stroke="#ff6b00" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Glowing Path Dots -->
  <circle cx="450" cy="150" r="4.5" fill="#ff6b00" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="550" cy="135" r="4.5" fill="#ffa800" stroke="#ffffff" stroke-width="1.5" />

  <!-- Bottom Stats Grid Inside Widget -->
  <rect x="330" y="270" width="100" height="25" rx="4" fill="rgba(255,255,255,0.02)" />
  <text x="340" y="286" font-family="'Inter', sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Assets</text>
  <text x="420" y="286" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" fill="#22c55e" text-anchor="end">+18.4%</text>

  <rect x="450" y="270" width="100" height="25" rx="4" fill="rgba(255,255,255,0.02)" />
  <text x="460" y="286" font-family="'Inter', sans-serif" font-size="8" fill="rgba(255,255,255,0.3)">Conversion</text>
  <text x="540" y="286" font-family="'Outfit', sans-serif" font-weight="700" font-size="9" fill="#22c55e" text-anchor="end">94.2%</text>
</svg>
