<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <!-- Definition of Gradients -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0f" />
      <stop offset="100%" stop-color="#14141a" />
    </linearGradient>
    <linearGradient id="blue-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ffa800" />
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Browser Container -->
  <rect width="600" height="350" rx="8" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  
  <!-- Browser Header Bar -->
  <path d="M 0,8 A 8,8 0 0,1 8,0 L 592,0 A 8,8 0 0,1 600,8 L 600,32 L 0,32 Z" fill="#181822" />
  <circle cx="18" cy="16" r="4.5" fill="#ef4444" />
  <circle cx="32" cy="16" r="4.5" fill="#fbbf24" />
  <circle cx="46" cy="16" r="4.5" fill="#22c55e" />
  
  <!-- Mock URL Bar -->
  <rect x="75" y="7" width="450" height="18" rx="4" fill="#0f0f15" stroke="rgba(255,255,255,0.04)" />
  <text x="300" y="20" font-family="'Inter', sans-serif" font-size="9" fill="rgba(255,255,255,0.3)" text-anchor="middle">architects.villupuram.dev</text>

  <!-- Web Content Area -->
  <!-- Navigation Header Mock -->
  <rect x="30" y="55" width="80" height="12" rx="2" fill="url(#blue-purple)" opacity="0.8" />
  <line x1="480" y1="61" x2="520" y2="61" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="535" y1="61" x2="570" y2="61" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Hero Headline Mock -->
  <text x="30" y="115" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="#ffffff">SPACES BUILT</text>
  <text x="30" y="145" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="url(#blue-purple)">TO LAST.</text>
  
  <!-- Subtext Lines -->
  <line x1="30" y1="175" x2="250" y2="175" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <line x1="30" y1="185" x2="190" y2="185" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Premium CTA button -->
  <rect x="30" y="210" width="100" height="28" rx="4" fill="#c2410c" />
  <text x="80" y="227" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Explore Portfolio</text>

  <!-- Right Visual element: Abstract 3D Architecture Graphic -->
  <!-- Subtle Grid lines -->
  <line x1="380" y1="50" x2="380" y2="330" stroke="rgba(255,255,255,0.03)" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="490" y1="50" x2="490" y2="330" stroke="rgba(255,255,255,0.03)" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="320" y1="160" x2="570" y2="160" stroke="rgba(255,255,255,0.03)" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="320" y1="240" x2="570" y2="240" stroke="rgba(255,255,255,0.03)" stroke-width="1" stroke-dasharray="4,4" />

  <!-- 3D Shape 1 -->
  <polygon points="380,110 490,70 540,150 430,190" fill="url(#accent-glow)" stroke="url(#blue-purple)" stroke-width="1.5" />
  
  <!-- 3D Shape 2 (Overlapping wireframe) -->
  <polygon points="400,180 510,140 560,220 450,260" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="2,2" />
  
  <!-- Intersecting Lines -->
  <line x1="490" y1="70" x2="510" y2="140" stroke="#ffa800" stroke-width="1" />
  <line x1="380" y1="110" x2="400" y2="180" stroke="#ff6b00" stroke-width="1" />
  <line x1="540" y1="150" x2="560" y2="220" stroke="#ffa800" stroke-width="1" />
  <line x1="430" y1="190" x2="450" y2="260" stroke="#ff6b00" stroke-width="1" />
  
  <!-- Small UI Overlays -->
  <rect x="330" y="270" width="85" height="40" rx="6" fill="#1b1b24" stroke="rgba(255,255,255,0.06)" />
  <circle cx="350" cy="290" r="10" fill="#ff6b00" opacity="0.2" />
  <circle cx="350" cy="290" r="4" fill="#ff6b00" />
  <rect x="368" y="284" width="36" height="5" rx="1" fill="rgba(255,255,255,0.4)" />
  <rect x="368" y="292" width="24" height="4" rx="1" fill="rgba(255,255,255,0.2)" />
</svg>
