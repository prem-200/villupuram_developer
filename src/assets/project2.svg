<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <!-- Definition of Gradients -->
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0f" />
      <stop offset="100%" stop-color="#14141a" />
    </linearGradient>
    <linearGradient id="blue-purple-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ffa800" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Browser Container -->
  <rect width="600" height="350" rx="8" fill="url(#bg-grad-2)" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  
  <!-- Browser Header Bar -->
  <path d="M 0,8 A 8,8 0 0,1 8,0 L 592,0 A 8,8 0 0,1 600,8 L 600,32 L 0,32 Z" fill="#181822" />
  <circle cx="18" cy="16" r="4.5" fill="#ef4444" />
  <circle cx="32" cy="16" r="4.5" fill="#fbbf24" />
  <circle cx="46" cy="16" r="4.5" fill="#22c55e" />
  
  <!-- Mock URL Bar -->
  <rect x="75" y="7" width="450" height="18" rx="4" fill="#0f0f15" stroke="rgba(255,255,255,0.04)" />
  <text x="300" y="20" font-family="'Inter', sans-serif" font-size="9" fill="rgba(255,255,255,0.3)" text-anchor="middle">boutique.villupuram.dev</text>

  <!-- Web Content Area -->
  <!-- Navigation Header Mock -->
  <rect x="30" y="55" width="70" height="10" rx="2" fill="url(#blue-purple-2)" opacity="0.8" />
  <!-- Cart Icon Mock -->
  <circle cx="560" cy="60" r="8" fill="#1e1b4b" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
  <path d="M 556,58 L 564,58 M 558,62 L 562,62" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  
  <!-- Header Text -->
  <text x="30" y="100" font-family="'Outfit', sans-serif" font-weight="800" font-size="18" fill="#ffffff">COLLECTIONS</text>
  
  <!-- Category Pill buttons -->
  <rect x="30" y="112" width="55" height="16" rx="8" fill="#c2410c" />
  <text x="57" y="123" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#ffffff" text-anchor="middle">All Items</text>

  <rect x="92" y="112" width="55" height="16" rx="8" fill="#1b1b24" stroke="rgba(255,255,255,0.08)" />
  <text x="119" y="123" font-family="'Inter', sans-serif" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle">Luxury</text>

  <rect x="154" y="112" width="55" height="16" rx="8" fill="#1b1b24" stroke="rgba(255,255,255,0.08)" />
  <text x="181" y="123" font-family="'Inter', sans-serif" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle">Crafted</text>

  <!-- Product Grid -->
  <!-- Product Card 1 -->
  <rect x="30" y="145" width="165" height="175" rx="6" fill="#13131a" stroke="rgba(255,255,255,0.04)" />
  <rect x="42" y="157" width="141" height="95" rx="4" fill="url(#bg-grad-2)" />
  <!-- Product Image mock shape (Gold Orb) -->
  <circle cx="112" cy="205" r="28" fill="url(#gold-grad)" opacity="0.85" />
  <circle cx="112" cy="205" r="24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3" />
  <!-- Card Text -->
  <rect x="42" y="265" width="80" height="6" rx="1.5" fill="rgba(255,255,255,0.5)" />
  <rect x="42" y="277" width="40" height="5" rx="1.5" fill="rgba(255,255,255,0.3)" />
  <!-- Price and Cart Button -->
  <text x="42" y="305" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#fbbf24">$249.00</text>
  <rect x="145" y="290" width="38" height="18" rx="4" fill="#ff6b00" />
  <text x="164" y="302" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">ADD</text>

  <!-- Product Card 2 -->
  <rect x="215" y="145" width="165" height="175" rx="6" fill="#13131a" stroke="rgba(255,255,255,0.04)" />
  <rect x="227" y="157" width="141" height="95" rx="4" fill="url(#bg-grad-2)" />
  <!-- Product Image mock shape (Purple Hexagon) -->
  <polygon points="297,175 322,190 322,220 297,235 272,220 272,190" fill="url(#blue-purple-2)" opacity="0.85" />
  <!-- Card Text -->
  <rect x="227" y="265" width="90" height="6" rx="1.5" fill="rgba(255,255,255,0.5)" />
  <rect x="227" y="277" width="50" height="5" rx="1.5" fill="rgba(255,255,255,0.3)" />
  <!-- Price and Cart Button -->
  <text x="227" y="305" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#fbbf24">$189.00</text>
  <rect x="330" y="290" width="38" height="18" rx="4" fill="#ff6b00" />
  <text x="349" y="302" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">ADD</text>

  <!-- Product Card 3 -->
  <rect x="400" y="145" width="165" height="175" rx="6" fill="#13131a" stroke="rgba(255,255,255,0.04)" />
  <rect x="412" y="157" width="141" height="95" rx="4" fill="url(#bg-grad-2)" />
  <!-- Product Image mock shape (Electric Blue Pyramid) -->
  <polygon points="482,175 517,225 447,225" fill="#ff6b00" opacity="0.85" />
  <polygon points="482,175 482,225 517,225" fill="#c2410c" opacity="0.9" />
  <!-- Card Text -->
  <rect x="412" y="265" width="75" height="6" rx="1.5" fill="rgba(255,255,255,0.5)" />
  <rect x="412" y="277" width="45" height="5" rx="1.5" fill="rgba(255,255,255,0.3)" />
  <!-- Price and Cart Button -->
  <text x="412" y="305" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#fbbf24">$315.00</text>
  <rect x="515" y="290" width="38" height="18" rx="4" fill="#ff6b00" />
  <text x="534" y="302" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">ADD</text>
</svg>
